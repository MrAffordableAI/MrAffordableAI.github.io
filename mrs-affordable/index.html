<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mrs. Affordable review desk</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <div class="brand"><span class="mark">MA</span><div><p class="eyebrow">Try desk</p><h1>Mrs. Affordable</h1></div></div>
    <p class="lede">This page runs the specialist review. It is not the private server, and a scan is not read here.</p>
  </header>
  <main>
    <section class="panel">
      <div class="panel-head"><h2>File</h2><button type="button" class="text-btn" id="sample">Load a deficient sample</button></div>
      <div class="grid">
        <label>State<select id="state"></select></label>
        <label>Programs<input id="programs" value="Tax Credit, HOME" /></label>
      </div>
      <textarea id="file" rows="8" placeholder="Paste the file text, or load the sample"></textarea>
      <button type="button" class="go" id="review">Review this file</button>
    </section>
    <section class="panel"><h2>Review</h2><pre id="out">Waiting for a file.</pre></section>
  </main>
  <script src="review.js"></script>
</body>
</html>
