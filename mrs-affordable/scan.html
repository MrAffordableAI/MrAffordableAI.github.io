<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mrs. Affordable scan</title>
  <link rel="stylesheet" href="styles.css?v=3" />
  <style>.drop{position:relative;border:1.5px dashed #8a6238;border-radius:12px;padding:28px 16px;text-align:center;background:#faf6ee}.drop input{position:absolute;inset:0;opacity:0}.hint{color:#5d564c;font-size:14px}</style>
</head>
<body>
  <header class="top">
    <div class="brand"><span class="mark">MA</span><div><p class="eyebrow">File scan</p><h1>Mrs. Affordable</h1></div></div>
    <p class="lede">Drop the tenant PDF. The review names the form and lists only the corrections the scan can support.</p>
  </header>
  <main>
    <section class="panel">
      <div class="drop" id="drop"><strong>Drop the tenant PDF here</strong><span>or tap to choose it</span><input id="file" type="file" accept="application/pdf,.pdf" /></div>
      <p class="hint" id="status">Waiting for a file.</p>
      <button type="button" class="text-btn" id="stop">Stop</button>
    </section>
    <section class="panel"><h2>Review</h2><pre id="out"></pre></section>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="scan.js?v=3"></script>
</body>
</html>
