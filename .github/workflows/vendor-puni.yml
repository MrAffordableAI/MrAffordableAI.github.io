name: vendor-puni
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host the game on this site
        run: |
          set -euo pipefail
          curl -fsSL "https://h.uguu.se/ZQqrudQF.js" -o puni/app.js
          curl -fsSL "https://d.uguu.se/ffMYeZhD.js" -o puni/heroes.js
          test "$(wc -c < puni/app.js)" -gt 84000
          test "$(wc -c < puni/heroes.js)" -gt 70000
          grep -q PUNI_HERO puni/heroes.js
          grep -q HEROES puni/app.js
          git config user.name "MrAffordableAI"
          git config user.email "demesae@yahoo.com"
          git add puni/app.js puni/heroes.js
          git commit -m "Add kawaii fantasy hero picker" || true
          git push
