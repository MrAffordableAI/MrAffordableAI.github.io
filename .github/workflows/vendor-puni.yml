name: vendor-puni
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host the game on this site
        run: |
          set -euo pipefail
          curl -fsSL "https://d.uguu.se/vHZcsgXx.js" -o puni/app.js
          curl -fsSL "https://h.uguu.se/jBoEUipD.js" -o puni/portraits.js
          test "$(wc -c < puni/app.js)" -gt 76000
          test "$(wc -c < puni/portraits.js)" -gt 70000
          grep -q faceHTML puni/app.js
          grep -q PUNI_ART puni/portraits.js
          git config user.name "MrAffordableAI"
          git config user.email "demesae@yahoo.com"
          git add puni/app.js puni/portraits.js
          git commit -m "Painted portraits and animated battle" || true
          git push
