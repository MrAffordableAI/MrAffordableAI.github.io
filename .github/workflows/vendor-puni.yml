name: vendor-puni
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host the game on this site
        run: |
          set -euo pipefail
          curl -fsSL "https://d.uguu.se/loWnoVZJ.js" -o puni/app.js
          test "$(wc -c < puni/app.js)" -gt 103000
          grep -q touchstart puni/app.js
          git config user.name "MrAffordableAI"
          git config user.email "demesae@yahoo.com"
          git add puni/app.js
          git commit -m "Fix joystick touch and keep walking" || true
          git push
