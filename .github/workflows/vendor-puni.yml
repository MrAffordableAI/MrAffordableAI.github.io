name: vendor-puni
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host the game on this site
        run: |
          set -euo pipefail
          curl -fsSL "https://d.uguu.se/TnekPgeh.js" -o puni/app.js
          test "$(wc -c < puni/app.js)" -gt 50000
          python3 - << 'PY'
          from pathlib import Path
          Path("puni/.nojekyll").write_text("")
          PY
          git config user.name "MrAffordableAI"
          git config user.email "demesae@yahoo.com"
          git add puni/app.js puni/.nojekyll
          git commit -m "Fix first catch so the map actually opens" || true
          git push
