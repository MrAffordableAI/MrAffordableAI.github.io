name: vendor-puni
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host the game on this site
        run: |
          set -euo pipefail
          curl -fsSL "https://n.uguu.se/LSUHnlZp.js" -o puni/app.js
          curl -fsSL "https://h.uguu.se/mlNciZdl.js" -o puni/foes.js
          test "$(wc -c < puni/app.js)" -gt 100000
          test "$(wc -c < puni/foes.js)" -gt 190000
          grep -q PUNI_FOE puni/foes.js
          git config user.name "MrAffordableAI"
          git config user.email "demesae@yahoo.com"
          git add puni/app.js puni/foes.js
          git commit -m "Kawaii monster foes, max 3, no pile-on" || true
          git push
