name: vendor-puni
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host the game on this site
        run: |
          set -euo pipefail
          curl -fsSL "https://d.uguu.se/RnnvGtyR.js" -o puni/app.js
          curl -fsSL "https://n.uguu.se/bVBeTLLe.js" -o puni/scenery.js
          test "$(wc -c < puni/app.js)" -gt 80000
          test "$(wc -c < puni/scenery.js)" -gt 200000
          grep -q PUNI_SCENE puni/scenery.js
          grep -q attackFX puni/app.js
          git config user.name "MrAffordableAI"
          git config user.email "demesae@yahoo.com"
          git add puni/app.js puni/scenery.js
          git commit -m "Painted town map and spectacular battle FX" || true
          git push
