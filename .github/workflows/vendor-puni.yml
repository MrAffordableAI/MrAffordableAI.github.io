name: vendor-puni
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host the game on this site
        run: |
          set -euo pipefail
          curl -fsSL "https://n.uguu.se/baStCCVZ.js" -o puni/app.js
          curl -fsSL "https://d.uguu.se/hLJbfsBm.js" -o puni/biomes.js
          test "$(wc -c < puni/app.js)" -gt 100000
          test "$(wc -c < puni/biomes.js)" -gt 400000
          grep -q PUNI_BIOME puni/biomes.js
          git config user.name "MrAffordableAI"
          git config user.email "demesae@yahoo.com"
          git add puni/app.js puni/biomes.js
          git commit -m "Clear missions plus fantasy world maps" || true
          git push
