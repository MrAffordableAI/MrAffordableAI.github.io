<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FF8FAB">
<title>Puni Go</title>
<link rel="manifest" href="manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style1.css">
<link rel="stylesheet" href="style2.css">
<link rel="stylesheet" href="style3.css">
<link rel="stylesheet" href="style4.css">
<style>
.player .avatar{background:transparent!important;box-shadow:none!important}
.player .heroart,.foeart{background:transparent!important;object-fit:contain}
.player.walking .heroart{animation:stride .28s ease-in-out infinite}
@keyframes stride{50%{transform:rotate(8deg) translateY(-8px)}}
.player .wand{position:absolute;right:2px;top:34px;width:44px;height:10px;border-radius:6px;background:linear-gradient(90deg,#fff,#ffd15c 40%,#ff6b9d);transform-origin:left center;z-index:5}
.player .wand:after{content:"";position:absolute;right:-8px;top:-7px;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#cdb4ff)}
</style>
</head>
<body>
<div id="root"></div>
<div id="toasts"></div>
<script src="portraits.js?v=cute"></script>
<script src="heroes.js?v=cute"></script>
<script src="foes.js?v=cute"></script>
<script src="scenery.js?v=cute"></script>
<script src="app.js?v=cute"></script>
</body>
</html>
