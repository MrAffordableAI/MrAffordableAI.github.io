<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FF8FAB">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Puni Go</title>
<link rel="manifest" href="manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style1.css">
<link rel="stylesheet" href="style2.css">
<link rel="stylesheet" href="style3.css">
<link rel="stylesheet" href="style4.css">
<style>
.sq{overflow:visible}
.orb,.orb-btn,.mini-orb{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
@keyframes popIn{0%{transform:scale(.15)}60%{transform:scale(1.16)}100%{transform:scale(1)}}
.pop{animation:popIn .55s cubic-bezier(.2,1.4,.4,1)}
.player.walking .avatar{animation:walk .28s ease-in-out infinite}
@keyframes walk{50%{transform:translateY(-6px) rotate(-6deg)}}
.wx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:4}
.faceart,.heroart{animation:idleBob 1.2s ease-in-out infinite}
@keyframes idleBob{50%{transform:translateY(-7px)}}
.mapart{object-fit:cover}
.heropick.on{outline:3px solid #ff8fab;border-radius:18px}
.player{width:78px;height:104px}
.player .avatar{background:transparent;box-shadow:none;width:78px;height:104px}
.player .heroart{width:78px!important;height:104px!important}
</style>
</head>
<body>
<div id="root"></div>
<div id="toasts"></div>
<script src="portraits.js?v=hero"></script>
<script src="heroes.js?v=hero"></script>
<script src="scenery.js?v=hero"></script>
<script src="app.js?v=hero"></script>
</body>
</html>
