<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FF8FAB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Puni Go</title>
<link rel="manifest" href="manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style1.css">
<link rel="stylesheet" href="style2.css">
<link rel="stylesheet" href="style3.css">
<link rel="stylesheet" href="style4.css">
<style>
.sq{overflow:visible}
.orb,.orb-btn,.mini-orb{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
@keyframes popIn{0%{transform:scale(.15)}60%{transform:scale(1.16)}100%{transform:scale(1)}}
.pop{animation:popIn .55s cubic-bezier(.2,1.4,.4,1)}
.player.walking .avatar{animation:walk .28s ease-in-out infinite}
@keyframes walk{50%{transform:translateY(-6px) rotate(-6deg)}}
.wx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:4}
.drop{position:absolute;top:-12px;width:2px;height:16px;background:rgba(255,255,255,.8);animation:rain .9s linear infinite}
@keyframes rain{to{transform:translateY(110vh)}}
.sunbeam{position:absolute;right:8%;top:6%;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,#fff6c8,transparent 70%)}
.petal{position:absolute;width:10px;height:8px;border-radius:10px 2px;animation:fall 8s linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(240deg)}}
</style>
</head>
<body>
<div id="root"></div>
<div id="toasts"></div>
<script src="app.js?v=myth"></script>
</body>
</html>
