<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FF8FAB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Puni Go — squeeze mystery orbs, collect cute squishies. You will not know what you get.">
<meta property="og:title" content="Puni Go">
<meta property="og:description" content="Squeeze first. Ask later.">
<meta property="og:url" content="https://mraffordableai.github.io/puni/">
<title>Puni Go</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style1.css">
<link rel="stylesheet" href="style2.css">
<link rel="stylesheet" href="style3.css">
<link rel="stylesheet" href="style4.css">
<style>
.sq{overflow:visible}
.orb,.orb-btn,.mini-orb{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes orbit{from{transform:rotate(0deg) translateX(96px)}to{transform:rotate(360deg) translateX(96px)}}
@keyframes popIn{0%{transform:scale(.15)}60%{transform:scale(1.16)}100%{transform:scale(1)}}
.pop{animation:popIn .55s cubic-bezier(.2,1.4,.4,1)}
.player.walking .avatar{animation:walk .28s ease-in-out infinite}
@keyframes walk{50%{transform:translateY(-6px) rotate(-6deg)}}
</style>
</head>
<body>
<div id="root"></div>
<div id="toasts"></div>
<script src="app.js?v=bounce"></script>
</body>
</html>
