<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FF8FAB">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Puni Go</title>
<link rel="manifest" href="manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style1.css">
<link rel="stylesheet" href="style2.css">
<link rel="stylesheet" href="style3.css">
<link rel="stylesheet" href="style4.css">
<style>
.sq{overflow:visible}
.orb,.orb-btn,.mini-orb{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
@keyframes popIn{0%{transform:scale(.15)}60%{transform:scale(1.16)}100%{transform:scale(1)}}
.pop{animation:popIn .55s cubic-bezier(.2,1.4,.4,1)}
.wx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:4}
.mapart{object-fit:cover}
.heropick.on{outline:3px solid #ff8fab;border-radius:18px}
.player{width:86px;height:128px;overflow:visible}
.player .avatar{background:transparent!important;box-shadow:none!important;width:86px;height:128px;overflow:visible}
.player .heroart{width:86px!important;height:128px!important;background:transparent!important;object-fit:contain}
.player .feet{position:absolute;left:50%;bottom:8px;width:40px;height:12px;margin-left:-20px;background:rgba(70,48,36,.32);border-radius:50%;z-index:0}
.player.walking .heroart{animation:stride .28s ease-in-out infinite}
@keyframes stride{
  0%{transform:rotate(-8deg) translateY(0) scaleY(1)}
  25%{transform:rotate(-2deg) translateY(-10px) scaleY(.94)}
  50%{transform:rotate(8deg) translateY(0) scaleY(1)}
  75%{transform:rotate(2deg) translateY(-10px) scaleY(.94)}
}
.player.walking .feet{animation:shadowstep .28s ease-in-out infinite}
@keyframes shadowstep{50%{transform:scaleX(.62);opacity:.35}}
.player.walking .shoulder{animation:armswing .28s ease-in-out infinite}
@keyframes armswing{50%{transform:translateY(-6px) rotate(-12deg)}}
</style>
</head>
<body>
<div id="root"></div>
<div id="toasts"></div>
<script src="portraits.js?v=walk"></script>
<script src="heroes.js?v=walk"></script>
<script src="scenery.js?v=walk"></script>
<script src="app.js?v=walk"></script>
</body>
</html>
