<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FF8FAB">
<title>Puni Go</title>
<link rel="manifest" href="manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style1.css">
<link rel="stylesheet" href="style2.css">
<link rel="stylesheet" href="style3.css">
<link rel="stylesheet" href="style4.css">
<style>
#toasts{position:fixed;left:0;right:0;bottom:108px;z-index:30;pointer-events:none;display:flex;justify-content:center}
.toast{position:static!important;margin:0!important}
#missionbar{top:52px;padding:6px 12px;pointer-events:none;font-size:14px}
.action{left:auto!important;right:10px!important;bottom:calc(var(--nav) + var(--safe-b) + 248px)!important;transform:none!important;min-width:0!important;width:108px!important;max-width:108px!important;font-size:12px!important;padding:8px!important;z-index:8}
.player{position:absolute!important;z-index:8}
.player .wand{position:absolute;right:0;top:22px;width:26px;height:64px;pointer-events:none;transform-origin:10px 54px;z-index:6}
.joy{z-index:40!important;touch-action:none}
.wx,.petals,#water,#foes,#bolts{pointer-events:none!important}
.foename{display:none}
</style>
</head>
<body>
<div id="root"></div>
<div id="toasts"></div>
<script src="portraits.js?v=clear"></script>
<script src="heroes.js?v=clear"></script>
<script src="foes.js?v=clear"></script>
<script src="biomes.js?v=clear"></script>
<script src="scenery.js?v=clear"></script>
<script src="app.js?v=clear"></script>
</body>
</html>
