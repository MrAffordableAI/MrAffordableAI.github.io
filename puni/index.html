<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FF8FAB">
<title>Puni Go</title>
<link rel="manifest" href="manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style1.css">
<link rel="stylesheet" href="style2.css">
<link rel="stylesheet" href="style3.css">
<link rel="stylesheet" href="style4.css">
<style>
#toasts{position:fixed;left:0;right:0;bottom:120px;z-index:30;pointer-events:none;display:flex;justify-content:center}
.toast{position:static!important;margin:0!important}
#missionbar{top:54px;padding:8px 12px;pointer-events:none}
#missionbar .muted{display:none}
.map{background:#f3c6de}
.player{position:absolute!important;z-index:8}
.joy{z-index:40!important;touch-action:none}
.wx,.petals,#water,#foes,#bolts{pointer-events:none!important}
.foename{display:none}
</style>
</head>
<body>
<div id="root"></div>
<div id="toasts"></div>
<script src="portraits.js?v=quiet"></script>
<script src="heroes.js?v=quiet"></script>
<script src="foes.js?v=quiet"></script>
<script src="biomes.js?v=quiet"></script>
<script src="scenery.js?v=quiet"></script>
<script src="app.js?v=quiet"></script>
</body>
</html>
