<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FF8FAB">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Puni Go</title>
<link rel="manifest" href="manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style1.css">
<link rel="stylesheet" href="style2.css">
<link rel="stylesheet" href="style3.css">
<link rel="stylesheet" href="style4.css">
<style>
.sq{overflow:visible}
.orb,.orb-btn,.mini-orb{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
@keyframes popIn{0%{transform:scale(.15)}60%{transform:scale(1.16)}100%{transform:scale(1)}}
.pop{animation:popIn .55s cubic-bezier(.2,1.4,.4,1)}
.player.walking .avatar{animation:walk .28s ease-in-out infinite}
@keyframes walk{50%{transform:translateY(-6px) rotate(-6deg)}}
.wx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:4}
.faceart{animation:idleBob 1.2s ease-in-out infinite}
@keyframes idleBob{50%{transform:translateY(-7px)}}
.mapart{object-fit:cover}
.life{position:absolute;inset:0;width:1600px;height:1900px;pointer-events:none;z-index:3}
.fly{position:absolute;width:7px;height:7px;border-radius:50%;background:#fff6c8;box-shadow:0 0 10px #ffe08a;animation:firefly 3.4s ease-in-out infinite}
@keyframes firefly{50%{transform:translate(18px,-22px);opacity:.25}}
.lantern{position:absolute;width:16px;height:22px;border-radius:6px 6px 8px 8px;background:#ffb347;box-shadow:0 0 18px #ff8fab;animation:glowpulse 1.6s ease-in-out infinite}
@keyframes glowpulse{50%{box-shadow:0 0 28px #ffe08a;transform:scale(1.12)}}
.koi{position:absolute;width:28px;height:12px;border-radius:20px;background:linear-gradient(90deg,#ff8fab,#fff);animation:swim 5s ease-in-out infinite}
.koi.late{animation-delay:1.4s}
@keyframes swim{50%{transform:translate(40px,18px) rotate(12deg)}}
.bloom{position:absolute;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#ff8fab 55%,#ff5d8f);pointer-events:auto;animation:bloom 1.8s ease-in-out infinite}
@keyframes bloom{50%{transform:scale(1.25)}}
.bloom.popped{pointer-events:none;opacity:.3}
</style>
</head>
<body>
<div id="root"></div>
<div id="toasts"></div>
<script src="portraits.js?v=live2"></script>
<script src="scenery.js?v=live2"></script>
<script src="app.js?v=live2"></script>
</body>
</html>
