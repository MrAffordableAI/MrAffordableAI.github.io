<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FF8FAB">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Puni Go</title>
<link rel="manifest" href="manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style1.css">
<link rel="stylesheet" href="style2.css">
<link rel="stylesheet" href="style3.css">
<link rel="stylesheet" href="style4.css">
<style>
.sq{overflow:visible}
.orb{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.mapart{object-fit:cover}
.player{width:86px;height:128px;overflow:visible}
.player .avatar{background:transparent!important;box-shadow:none!important;width:86px;height:128px}
.player .heroart{width:86px!important;height:128px!important;background:transparent!important;object-fit:contain}
.player.walking .heroart{animation:stride .28s ease-in-out infinite}
@keyframes stride{50%{transform:rotate(8deg) translateY(-8px)}}
.player .wings{position:absolute;left:50%;top:28px;width:86px;height:36px;margin-left:-43px;opacity:0}
.player .wings:before,.player .wings:after{content:"";position:absolute;width:34px;height:28px;border-radius:70% 20%;background:linear-gradient(135deg,#fff,#cdb4ff)}
.player .wings:before{left:0}
.player .wings:after{right:0}
.player.flying .wings{opacity:1;animation:flap .28s ease-in-out infinite}
.player.flying .heroart{animation:hover .7s ease-in-out infinite}
@keyframes flap{50%{transform:scaleY(.8)}}
@keyframes hover{50%{transform:translateY(-18px)}}
.foe{position:absolute;transform:translate(-50%,-50%);border:0;background:transparent;z-index:4;animation:bob 1.2s ease-in-out infinite}
.foe span{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#cdb4ff 40%,#7a5cff);font-size:26px}
.foe.boss span{width:64px;height:64px;font-size:34px;background:radial-gradient(circle at 30% 30%,#fff6c8,#ff8fab 40%,#c0392b)}
.foe b{display:block;font-size:10px;background:#fff;border-radius:8px;padding:1px 6px;margin-top:4px}
</style>
</head>
<body>
<div id="root"></div>
<div id="toasts"></div>
<script src="portraits.js?v=fifty"></script>
<script src="heroes.js?v=fifty"></script>
<script src="scenery.js?v=fifty"></script>
<script src="app.js?v=fifty"></script>
</body>
</html>
