<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FF8FAB">
<title>Puni Go</title>
<link rel="manifest" href="manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style1.css">
<link rel="stylesheet" href="style2.css">
<link rel="stylesheet" href="style3.css">
<link rel="stylesheet" href="style4.css">
<style>
.player .avatar{background:transparent!important;box-shadow:none!important}
.player .heroart,.foeart{background:transparent!important;object-fit:contain}
.player.walking .heroart{animation:stride .26s ease-in-out infinite}
@keyframes stride{50%{transform:rotate(7deg) translateY(-10px)}}
.player .wand{position:absolute;right:-6px;top:8px;width:30px;height:96px;z-index:6;pointer-events:none;transform-origin:12px 80px}
.joy{z-index:40!important;touch-action:none}
.wx,.petals,#water{pointer-events:none!important}
#missionbar{z-index:12;pointer-events:none}
</style>
</head>
<body>
<div id="root"></div>
<div id="toasts"></div>
<script src="portraits.js?v=stick"></script>
<script src="heroes.js?v=stick"></script>
<script src="foes.js?v=stick"></script>
<script src="biomes.js?v=stick"></script>
<script src="scenery.js?v=stick"></script>
<script src="app.js?v=stick"></script>
</body>
</html>
